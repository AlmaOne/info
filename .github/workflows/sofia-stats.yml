# Ефирът на София – на всеки ~10 мин събира слушателите на софийските радиа
# и ги записва в клона „sofia-data“: stats.json + история по дни в history/ (последните 90 дни).
# Клонът винаги има само ЕДИН запис (презаписва се), за да не расте repo-то.
# Страницата sofia.html чете оттам радиата, които браузърът не може да провери сам.
# GitHub пуска планираните задачи със закъснение – реално на всеки 10–20 мин.

name: Ефирът на София

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sofia-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Вземи досегашните данни
        run: |
          mkdir data
          if git ls-remote --exit-code --heads origin sofia-data >/dev/null; then
            git fetch -q --depth 1 origin sofia-data
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
          fi

      - name: Събери слушателите
        env:
          KEEP_DAYS: 90
        run: node scripts/sofia-collect.js data

      - name: Запиши (един запис, презаписан)
        run: |
          cd data
          git init -q -b sofia-data
          git config user.name  "sofia-bot"
          git config user.email "sofia-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "данни $(TZ=Europe/Sofia date '+%F %H:%M')"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git push -q -f "$url" sofia-data && exit 0
            echo "Опит $i не успя – пробвам пак след $((i*5)) сек."
            sleep $((i*5))
          done
          echo "Записът не успя след 5 опита."
          exit 1
